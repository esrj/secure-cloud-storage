directories: # Where data are stored
  uploads: uploads
  certs: certs
  logs: logs
  database: database
  blockchain: blockchain
  ssh: ssh
server: # Server settings
  host: 0.0.0.0
  key: tls.key
  cert: tls.crt
  https:
    port: 3001
  ftps:
    port:
      control: 7002
      data: 7000
    pasv_url: 'localhost:7000'
  ssh:
    key: id_ed25519
  sftp:
    port: 7001
database: # Database settings
  user: postgres
  host: localhost
  database: postgres
  password: postgres
  port: 5432
  pool:
    max: 20
    idleTimeoutMillis: 30000
    connectionTimeoutMillis: 2000
  ssl:
    rejectUnauthorized: true
  descMaxLength: 2000
  # 角色或資料庫還不存在時（新環境第一次啟動），Server 依序用這些管理者帳號嘗試自動建立；設成 [] 即不使用
  bootstrapRoles:
  - user: postgres
    password: postgres
  # null values will be seen as the same as global settings
  secretShare:
  - user: null
    host: null
    database: secret_share1
    password: null
    port: null
  - user: null
    host: null
    database: secret_share2
    password: null
    port: null
  - user: null
    host: null
    database: secret_share3
    password: null
    port: null
login:
  idleTimeoutMin: 30
  failedAttemptLimit: 5
  failedRecordRefreshMin: 5
  failedBlockTimeMin: 15
blockchain:
  jsonRpcUrl: ''
  contractAddr: ''
  walletKeyPath: wallet.key
  abiPath: abi.json
  enabled: true
settings: # Other settings
  uploadExpireTimeMin: 10
  emailAuthExpireTimeMin: 5
  emailAuthLength: 6
  agentLogMaxChars: 8000 # 智慧搜尋對話紀錄單則訊息保存上限
trustedAuthority:
  url: 'localhost:2999'
smtp:
  host: localhost
  user: user
  pass: pass
  from: user@example.mail
  enabled: true
  useMailerSend: false
  apiKey: ''
fido: # 指紋帳號復原（FIDO2 安全金鑰）。rpId 必須與 Client 端 FidoProvider 相同
  rpId: secure-cloud-storage.local
  rpName: Secure Cloud Storage
  challengeTimeoutSec: 120 # challenge 有效秒數，一次性
  recoverWindowMin: 10 # Email OTP 通過後，多久內可以用金鑰復原
  maxMethodsPerUser: 5 # 每個帳號最多綁定幾支金鑰
  maxRecoverAttempts: 5 # 同一次 OTP 內金鑰驗證失敗幾次後必須重新收信
admin: # 啟動與註冊時，email 在此清單者自動成為管理員；亦可直接在資料庫設定 users.role
  emails: []
agent: # 智慧搜尋的語言模型。Client 不自己連 Ollama，由 Server 代為呼叫（agent-llm 事件）
  ollama:
    url: 'http://127.0.0.1:11434' # Docker 部署時在 local.yaml 改成 http://ollama:11434
    model: 'gemma4-31b-8k:latest'
    numCtx: 8192 # 每次呼叫都要相同，否則 Ollama 會重新載入模型
    keepAlive: '30m' # 模型閒置多久後卸載；正式主機在 local.yaml 設 -1（常駐 GPU）
    timeoutSec: 150 # 等 Ollama 回應的上限，須短於 Client 等 Server 的 180 秒
  maxRequestsPerMinute: 10 # 每位使用者每分鐘的呼叫上限；一次搜尋會呼叫兩次
  warmUp: false # Server 啟動時先載入模型；正式主機在 local.yaml 設 true
